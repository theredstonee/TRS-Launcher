modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0-only"
issueTrackerURL = "https://github.com/theredstonee/TRS-Launcher/issues"

[[mods]]
modId = "trsclient"
version = "${version}"
displayName = "TRS Client"
authors = "theredstonee"
displayURL = "https://github.com/theredstonee/TRS-Launcher"
description = '''
In-Game-Client des TRS Launchers: HUD (FPS, CPS, Tastenanzeige, Ping), Zoom, Fullbright und ein eigenes Menü (Rechte Umschalttaste).
'''
# Reine Client-Mod: Server müssen sie nicht haben, Versionsabgleich mit dem Server entfällt.
displayTest = "IGNORE_ALL_VERSION"

[[mixins]]
config = "trsclient.mixins.json"

[[dependencies.trsclient]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "CLIENT"

# Nur mit 1.21.1 getestet – bewusst keine breitere Spanne.
[[dependencies.trsclient]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "CLIENT"
