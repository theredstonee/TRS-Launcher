import groovy.json.JsonOutput

plugins {
	id 'java'
	id 'net.neoforged.moddev' version '2.0.147'
}

group = maven_group
version = mod_version

base {
	archivesName = "trsclient-neoforge-${minecraft_version}"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 21
}

// Versionsunabhängige Logik (Module, Config, HUD-Mathe, CPS, Zoom) direkt aus ../common –
// gleiche Java-Version (21), daher keine Kopie nötig. Die Tests von common laufen hier mit.
sourceSets {
	main.java.srcDir '../common/src/main/java'
	test.java.srcDir '../common/src/test/java'
}

repositories {
	mavenCentral()
}

neoForge {
	version = neo_version

	runs {
		client {
			client()
			// Eigenes Spielverzeichnis je Loader/Version (Welten und Configs kollidieren sonst).
			gameDirectory = project.file('../run/neoforge-1.21.1')
			// Mixin-Anwendung sichtbar im Log (Nachweis, dass der Mixin greift).
			systemProperty 'mixin.debug.verbose', 'true'
			// ./gradlew runClient -PtrsAutotest → Menü, Testwelt, Screenshots, beendet das Spiel.
			if (project.hasProperty('trsAutotest')) {
				systemProperty 'trsclient.autotest', 'true'
			}
		}
	}

	mods {
		trsclient {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	testImplementation "com.google.code.gson:gson:${gson_version}"
	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

processResources {
	def props = [version: project.version, minecraft_version: minecraft_version]
	inputs.properties props
	filesMatching('META-INF/neoforge.mods.toml') {
		expand props
	}
}

jar {
	from(file('../LICENSE')) {
		rename { "${it}_trsclient" }
	}
}

// --- Übergabe an den Launcher ---------------------------------------------------------------
// NeoForge 1.21.1 läuft mit Mojang-Namen – die normale JAR ist direkt die fertige Mod.
def distDir = file('../dist')
def launcherJarName = "trsclient-neoforge-${minecraft_version}.jar"

tasks.register('collectLauncherJars', Copy) {
	group = 'build'
	description = 'Kopiert die Mod-JAR nach client-mod/dist/ und schreibt builds-neoforge.json.'
	dependsOn tasks.named('jar')
	from(tasks.named('jar').flatMap { it.archiveFile })
	into distDir
	rename { launcherJarName }
	def mcVersion = minecraft_version
	def neoVersion = neo_version
	inputs.property 'neoforge', neoVersion
	doLast {
		def builds = [[
				loader   : 'neoforge',
				minecraft: [mcVersion],
				file     : launcherJarName,
				// Keine weiteren Mods nötig – nur NeoForge selbst (getestet mit neoVersion).
				requires : [],
				neoforge : neoVersion,
		]]
		new File(distDir, 'builds-neoforge.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(builds)) + '\n', 'UTF-8')
	}
}

tasks.named('build') {
	finalizedBy 'collectLauncherJars'
}
