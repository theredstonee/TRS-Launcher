// TRS Client für NeoForge – EIN Quellbaum (src/), ein Build je Minecraft-Version (Stonecutter).
// Eigenständiger Gradle-Build (nicht Teil von ../settings.gradle): NeoForge braucht ModDevGradle statt Loom.
// Die versionsunabhängige Logik kommt als Quellordner aus ../common (siehe build.gradle).
pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		maven { url = 'https://maven.neoforged.net/releases' }
		// Stonecutter (Mehrversions-Präprozessor)
		maven { url = 'https://maven.kikugie.dev/releases' }
	}
	plugins {
		// ModDevGradle (geprüft über maven.neoforged.net, Stand 2026-09-22: neueste 2.0.147)
		id 'net.neoforged.moddev' version '2.0.147'
	}
}

plugins {
	// Lädt bei Bedarf automatisch JDK 17/21/25 (Gradle-Toolchains).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'trsclient-neoforge'

// Jede Minecraft-Version, für die es NeoForge gibt (1.20.2 ist die erste NeoForge-Version nach 1.20.1).
// Neue Version: hier eintragen + versions/<version>/gradle.properties (neo_version) anlegen.
stonecutter {
	create(rootProject) {
		versions '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
				'1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8',
				'1.21.9', '1.21.10', '1.21.11',
				'26.1', '26.1.1', '26.1.2', '26.2', '26.3'
		// Version, in deren Zustand src/ eingecheckt ist.
		vcsVersion = '1.21.1'
	}
}
