org.gradle.jvmargs=-Xmx4G
# Loom ist nicht mit dem Configuration-Cache kompatibel.
org.gradle.configuration-cache=false
# Architectury-Loom: Zielplattform Forge (gilt für alle Versions-Unterprojekte).
loom.platform=forge

# Mod
mod_version=0.9.1
maven_group=dev.theredstonee.trsclient

# Bibliotheken
junit_version=5.12.2
# Gson-Version, die Minecraft 1.8.9 selbst mitliefert (nur für Tests; ab 1.9 bringt MC neuere mit).
gson_version=2.2.4

# Stonecutter-Hinweis zu Groovy-Buildskripten ausblenden.
dev.kikugie.stonecutter.hard_mode=true
