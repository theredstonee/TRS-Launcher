org.gradle.jvmargs=-Xmx3G
# ForgeGradle ist nicht mit dem Configuration-Cache kompatibel.
org.gradle.configuration-cache=false

# Mod
mod_version=0.6.1
maven_group=dev.theredstonee.trsclient

# Minecraft / Forge 1.13.2 (promotions_slim.json: kein "recommended", 1.13.2-latest = 25.0.223)
minecraft_version=1.13.2
forge_version=25.0.223
# MCP-Namen: letzte stabile Mappings für 1.13.2 (Mojang-Mappings gibt es erst ab 1.14.4).
mcp_channel=stable
mcp_version=47-1.13.2

# Bibliotheken
junit_version=5.12.2
# Gson-Version, die Minecraft 1.13.2 selbst mitliefert (nur für Tests).
gson_version=2.8.0
