import groovy.json.JsonOutput

plugins {
	id 'java'
	// ForgeGradle 6 (Gradle 8.x): verarbeitet die (2021 neu veröffentlichte) Userdev-Spec 2 von Forge 1.13.2.
	id 'net.minecraftforge.gradle' version '6.0.54'
}

group = maven_group
version = mod_version

base {
	archivesName = "trsclient-forge-${minecraft_version}"
}

java {
	// Minecraft 1.13.2 + ModLauncher 2 laufen nur auf Java 8.
	toolchain {
		languageVersion = JavaLanguageVersion.of(8)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}

minecraft {
	mappings channel: mcp_channel, version: mcp_version

	runs {
		client {
			// Eigenes Spielverzeichnis je Loader/Version: client-mod/run/forge-1.13.2 (git-ignoriert).
			workingDirectory project.file('../run/forge-1.13.2')
			property 'forge.logging.console.level', 'info'
			// ./gradlew runClient -PtrsAutotest → Menü, Testwelt, Screenshots, beendet das Spiel.
			if (project.hasProperty('trsAutotest')) {
				property 'trsclient.autotest', 'true'
			}
			mods {
				trsclient {
					source sourceSets.main
				}
			}
		}
	}
}

// FML 1.13.2 bricht mit NoSuchFileException ab, wenn das mods-Verzeichnis im Spielordner fehlt.
tasks.matching { it.name == 'runClient' }.configureEach {
	doFirst { project.file('../run/forge-1.13.2/mods').mkdirs() }
}

repositories {
	mavenCentral()
}

dependencies {
	minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

	// Tests laufen gegen dieselbe Gson-Version, die Minecraft 1.13.2 mitbringt.
	testImplementation "com.google.code.gson:gson:${gson_version}"
	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events 'failed'
	}
}

processResources {
	def props = [version: project.version]
	inputs.properties props
	filesMatching('META-INF/mods.toml') {
		expand props
	}
}

jar {
	manifest.attributes(
			'Implementation-Title': 'TRS Client',
			'Implementation-Version': project.version,
			'Implementation-Vendor': 'theredstonee')
	from(file('../LICENSE')) {
		rename { "${it}_trsclient" }
	}
	finalizedBy 'reobfJar'
}

// --- Übergabe an den Launcher ---------------------------------------------------------------
// Forge 1.13.2 läuft in Produktion mit SRG-Namen → reobfJar schreibt die JAR mit SRG-Namen neu
// (in-place, build/libs/). Diese wird nach client-mod/dist/ kopiert, dazu builds-forge-1.13.2.json.
def distDir = file('../dist')
def launcherJarName = "trsclient-forge-${minecraft_version}.jar"

tasks.register('collectLauncherJars', Copy) {
	group = 'build'
	description = 'Kopiert die Mod-JAR nach client-mod/dist/ und schreibt builds-forge-1.13.2.json.'
	dependsOn tasks.named('reobfJar')
	from(tasks.named('jar').flatMap { it.archiveFile })
	into distDir
	rename { launcherJarName }
	def mcVersion = minecraft_version
	def forgeVersion = "${minecraft_version}-${forge_version}".toString()
	inputs.property 'forge', forgeVersion
	doLast {
		def builds = [[
				loader   : 'forge',
				minecraft: [mcVersion],
				file     : launcherJarName,
				requires : [],
				forge    : forgeVersion,
		]]
		new File(distDir, 'builds-forge-1.13.2.json').setText(JsonOutput.prettyPrint(JsonOutput.toJson(builds)) + '\n', 'UTF-8')
	}
}

tasks.named('build') {
	finalizedBy 'collectLauncherJars'
}
