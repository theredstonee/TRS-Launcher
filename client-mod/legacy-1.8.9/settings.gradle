// TRS Client für Minecraft 1.8.9 (Forge) – eigenständiger Gradle-Build.
// Absichtlich NICHT Teil des Builds in client-mod/: Legacy-Forge braucht eine eigene Loom-Variante
// (Essentials architectury-loom-Fork) und Java 8 zum Kompilieren/Starten.
pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		maven { url = 'https://repo.essential.gg/repository/maven-public/' }
		maven { url = 'https://maven.architectury.dev/' }
		maven { url = 'https://maven.fabricmc.net/' }
		maven { url = 'https://maven.minecraftforge.net/' }
	}
	resolutionStrategy {
		eachPlugin {
			if (requested.id.id == 'gg.essential.loom') {
				useModule("gg.essential:architectury-loom:${requested.version}")
			}
		}
	}
}

plugins {
	// Lädt bei Bedarf automatisch ein JDK 8 (Gradle-Toolchains).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'trsclient-legacy-1.8.9'
