// TRS Client für Minecraft 1.20.1 (Forge) – eigenständiger Gradle-Build.
// Absichtlich NICHT Teil des Builds in client-mod/: Forge 1.20.1 braucht ModDevGradle (Legacy-Forge)
// und Java 17. Die versionsunabhängige Logik kommt als Quellordner aus ../common (siehe build.gradle).
pluginManagement {
	repositories {
		gradlePluginPortal()
		mavenCentral()
		maven { url = 'https://maven.neoforged.net/releases' }
	}
}

plugins {
	// Lädt bei Bedarf automatisch ein JDK 17 (Gradle-Toolchains).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'trsclient-forge-1.20.1'
