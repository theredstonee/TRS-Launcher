import groovy.json.JsonOutput

plugins {
	id 'java'
	// ModDevGradle für Forge 1.17–1.20.x: Mojang-Namen im Code, reobfJar → SRG für Produktion.
	id 'net.neoforged.moddev.legacyforge' version '2.0.147'
}

group = maven_group
version = mod_version

base {
	archivesName = "trsclient-forge-${minecraft_version}"
}

java {
	// Minecraft 1.20.1 läuft auf Java 17.
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = 17
}

// Versionsunabhängige Logik (Module, Config, HUD-Mathe, CPS, Zoom) direkt aus ../common –
// common nutzt nur Java-17-Sprachmittel (sealed, records), daher keine Kopie nötig.
// Die Tests von common laufen hier gegen Java 17 und Gson 2.10 mit.
sourceSets {
	main.java.srcDir '../common/src/main/java'
	test.java.srcDir '../common/src/test/java'
}

repositories {
	mavenCentral()
}

legacyForge {
	version = "${minecraft_version}-${forge_version}"

	runs {
		client {
			client()
			// Eigenes Spielverzeichnis je Loader/Version (1.20.1 kann neuere Testwelten nicht öffnen).
			gameDirectory = project.file('../run/forge-1.20.1')
			// Mixin-Anwendung sichtbar im Log (Nachweis, dass die Mixins greifen).
			systemProperty 'mixin.debug.verbose', 'true'
			// ./gradlew runClient -PtrsAutotest → Menü, Testwelt, Screenshots, beendet das Spiel.
			if (project.hasProperty('trsAutotest')) {
				systemProperty 'trsclient.autotest', 'true'
			}
		}
	}

	mods {
		trsclient {
			sourceSet sourceSets.main
		}
	}
}

// Forge 1.20.1 läuft in Produktion mit SRG-Namen → Mixins brauchen eine Refmap.
mixin {
	add sourceSets.main, 'trsclient.refmap.json'
	config 'trsclient.mixins.json'
}

dependencies {
	annotationProcessor "org.spongepowered:mixin:${mixin_version}:processor"

	testImplementation "com.google.code.gson:gson:${gson_version}"
	testImplementation platform("org.junit:junit-bom:${junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

processResources {
	def props = [version: project.version, minecraft_version: minecraft_version]
	inputs.properties props
	filesMatching('META-INF/mods.toml') {
		expand props
	}
}

jar {
	// Forge 1.20.1 findet Mixin-Configs in Produktion nur über dieses Manifest-Attribut
	// (mixin { config … } oben wirkt nur auf die Dev-Starts).
	manifest.attributes('MixinConfigs': 'trsclient.mixins.json')
	from(file('../LICENSE')) {
		rename { "${it}_trsclient" }
	}
}

// --- Übergabe an den Launcher ---------------------------------------------------------------
// Kopiert die auf SRG-Namen remappte JAR (reobfJar) nach client-mod/dist/ und schreibt
// builds-forge-1.20.1.json mit den Angaben, die der Launcher zum Installieren braucht.
def distDir = file('../dist')
def launcherJarName = "trsclient-forge-${minecraft_version}.jar"

tasks.register('collectLauncherJars', Copy) {
	group = 'build'
	description = 'Kopiert die Mod-JAR nach client-mod/dist/ und schreibt builds-forge-1.20.1.json.'
	dependsOn tasks.named('reobfJar')
	from(tasks.named('reobfJar').flatMap { it.archiveFile })
	into distDir
	rename { launcherJarName }
	def mcVersion = minecraft_version
	def forgeVersion = forge_version
	inputs.property 'forge', forgeVersion
	doLast {
		def builds = [[
				loader   : 'forge',
				minecraft: [mcVersion],
				file     : launcherJarName,
				// Keine weiteren Mods nötig – nur Forge selbst (getestet mit forgeVersion).
				requires : [],
				forge    : "${mcVersion}-${forgeVersion}".toString(),
		]]
		new File(distDir, "builds-forge-${mcVersion}.json").setText(JsonOutput.prettyPrint(JsonOutput.toJson(builds)) + '\n', 'UTF-8')
	}
}

tasks.named('build') {
	finalizedBy 'collectLauncherJars'
}
