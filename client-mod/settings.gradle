pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		// Stonecutter (Mehrversions-Präprozessor für :fabric)
		maven {
			name = 'KikuGie Releases'
			url = 'https://maven.kikugie.dev/releases'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	// Lädt bei Bedarf automatisch ein JDK 21 (Gradle-Toolchains).
	id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
	// Mehrversions-Build für :fabric (ein Quellbaum, ein Build je Minecraft-Version).
	id 'dev.kikugie.stonecutter' version '0.9.8'
}

rootProject.name = 'trs-client'

// Versionsunabhängige Logik (Module, Config, HUD-Mathe) – reines Java, ohne Minecraft.
include 'common'

// --- Fabric (Stonecutter) --------------------------------------------------------------
// Ein Quellbaum in fabric/src, ein Unterprojekt je Minecraft-Version (:fabric:<version>).
// Unterschiede zwischen Versionen stehen als Stonecutter-Kommentare im Code (//? if >=1.21.2 ...).
// Neue Version: hier eintragen + fabric/versions/<version>/gradle.properties anlegen.
stonecutter {
	create(':fabric') {
		// 1.14–1.14.3 fehlen (keine offiziellen Mojang-Mappings), 1.15/1.15.1/1.16 fehlen, weil deren neueste
		// Fabric API (die der Launcher installiert) noch keine lifecycle-events-v1 hat; 1.16.1 fehlt (API vor 1.16.2 zu verschieden).
		versions '1.14.4', '1.15.2', '1.16.2', '1.16.3', '1.16.4', '1.16.5',
				'1.17', '1.17.1', '1.18', '1.18.1', '1.18.2',
				'1.19', '1.19.1', '1.19.2', '1.19.3', '1.19.4',
				'1.20.1', '1.20.2', '1.20.3', '1.20.4', '1.20.5', '1.20.6',
				'1.21', '1.21.1', '1.21.2', '1.21.3', '1.21.4', '1.21.5', '1.21.6', '1.21.7', '1.21.8',
				'1.21.9', '1.21.10', '1.21.11',
				'26.1', '26.1.1', '26.1.2', '26.2', '26.3'
		// Version, in deren Zustand fabric/src eingecheckt ist.
		vcsVersion = '1.21.1'
	}
}
// ---------------------------------------------------------------------------------------
