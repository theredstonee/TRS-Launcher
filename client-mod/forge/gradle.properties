org.gradle.jvmargs=-Xmx4G
org.gradle.configuration-cache=false
org.gradle.parallel=true
org.gradle.caching=true
# Nur die angefragten Versionen konfigurieren: ForgeGradle erzeugt das Minecraft-Artefakt schon beim Konfigurieren
# (einmalig mehrere Minuten je Version, danach aus ~/.gradle/caches/minecraftforge).
org.gradle.configureondemand=true
# ForgeGradle 7: Klassen und Ressourcen in denselben Ausgabeordner, damit Forge die Mod beim Dev-Start findet.
net.minecraftforge.gradle.merge-source-sets=true

# Mod
mod_version=0.6.0
maven_group=dev.theredstonee.trsclient

# Werkzeuge (Versionen gegen plugins.gradle.org / maven.minecraftforge.net geprüft, Stand 2026-09-22)
#   ForgeGradle 7.0.40 (net.minecraftforge.gradle) und Renamer 1.1.7 (net.minecraftforge.renamer)
#   stehen im plugins-Block von stonecutter.gradle.
# Mixin-Annotation-Processor für die Refmap der SRG-Versionen (1.20 – 1.20.4)
mixin_processor_version=0.8.7

# Bibliotheken (nur Tests von common)
junit_version=5.12.2
gson_version=2.10
