// Build-Skript für JEDE Forge-Version (:<minecraft>), ausgeführt von Stonecutter.
// Quellcode: src/ (vorverarbeitet je Version) + ../common/src/main/java (unverändert).
// Versionsspezifische Werte: versions/<minecraft>/gradle.properties
//
// Namen zur Laufzeit (aus den install_profile.json der Forge-Installer geprüft):
//   1.20 – 1.20.4   SRG (MCPConfig)   → Renamer: JAR nach SRG + Mixin-Refmap
//   1.20.6 – 1.21.11 Mojang-Namen      → JAR unverändert
//   26.x            nicht obfuskiert   → JAR unverändert, keine Mappings
import groovy.json.JsonOutput

def mc = stonecutter.current.version
def srg = stonecutter.eval(mc, '<1.20.5')
def unobfuscated = stonecutter.eval(mc, '>=26.1')
def javaVersion = unobfuscated ? 25 : (srg ? 17 : 21)
// Forge-Hauptversion = FML-Loader-Version (mods.toml loaderVersion)
def forgeMajor = project.forge_version.toString().tokenize('.')[0]

apply plugin: 'java'
apply plugin: 'net.minecraftforge.gradle'
if (srg) apply plugin: 'net.minecraftforge.renamer'

group = rootProject.maven_group
version = rootProject.mod_version

base {
	archivesName = "trsclient-forge-${mc}"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(javaVersion)
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release = javaVersion
}

// Versionsunabhängige Logik direkt aus ../common (mit dem Java-Level DIESER Version kompiliert).
sourceSets {
	main.java.srcDir(rootProject.file('../common/src/main/java'))
	main.resources.srcDir(rootProject.file('../common/src/main/resources'))
	test.java.srcDir(rootProject.file('../common/src/test/java'))
}

minecraft {
	if (!unobfuscated) {
		mappings channel: 'official', version: mc.toString()
	}
	runs {
		register('client') {
			// Eigenes Spielverzeichnis je Loader/Version: client-mod/run/forge-<minecraft>
			workingDir = rootProject.layout.projectDirectory.dir("../run/forge-${mc}")
			// Im Dev-Start liegt die Mod nicht als JAR vor → Mixin-Config per Argument.
			args '--mixin.config=trsclient.mixins.json'
			// Mixin-Anwendung sichtbar im Log (Nachweis, dass die Mixins greifen).
			systemProperty 'mixin.debug.verbose', 'true'
			// ./gradlew :<v>:runClient -PtrsAutotest → Menü, Testwelt, Screenshots, beendet das Spiel.
			if (project.hasProperty('trsAutotest')) {
				systemProperty 'trsclient.autotest', 'true'
			}
			// -PtrsApi=http://127.0.0.1:8787 → TRS API + Mojang-Join gegen eine lokale Attrappe (Umhang-/Abzeichen-Tests)
			if (project.hasProperty('trsApi')) {
				systemProperty 'trsclient.api.url', project.trsApi
				systemProperty 'trsclient.session.url', project.trsApi
			}
		}
	}
}

repositories {
	minecraft.mavenizer(it)
	maven fg.forgeMaven
	maven fg.minecraftLibsMaven
	mavenCentral()
}

dependencies {
	implementation minecraft.dependency("net.minecraftforge:forge:${mc}-${project.forge_version}")
	if (srg) {
		annotationProcessor "org.spongepowered:mixin:${rootProject.mixin_processor_version}:processor"
	}

	testImplementation "com.google.code.gson:gson:${rootProject.gson_version}"
	testImplementation platform("org.junit:junit-bom:${rootProject.junit_version}")
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
}

if (srg) {
	// Forge 1.20 – 1.20.4 lädt Minecraft mit SRG-Namen: Klassen umbenennen und eine Refmap für die Mixins erzeugen.
	renamer.mappings(minecraft.dependency.toSrg)
	renamer.enableMixinRefmaps {
		config 'trsclient.mixins.json'
		// Eindeutiger Name statt "main.refmap.json" (alle Mod-JARs teilen sich einen Klassenpfad).
		refMap = 'trsclient.refmap.json'
	}
	renamer.classes(tasks.named('jar', Jar)) {
		archiveClassifier = 'srg'
		// Enthält auch die vom Mixin-Annotation-Processor erzeugten Einträge.
		mappings renamer.mixin.generatedMappings
	}
}

// Mixin-Liste je Version: die Ziele einiger Hooks gibt es nicht in jeder Version.
def mixinClasses = ['CameraMixin', 'CrosshairMixin', 'FovMixin', 'GuiMixin', 'LightmapMixin', 'MinecraftMixin',
		'MouseHandlerMixin', 'OverlayTextureAccessor', 'TitleScreenMixin',
		'AttackMixin', 'BlockOutlineMixin', 'ChatComponentAccessor', 'ChatMixin', 'ChatScreenMixin',
		'HurtCamMixin', 'LowFireMixin', 'OldAnimationsMixin',
		// TRS API: TRS-Umhang-Textur, Umhang-Physik, Abzeichen in Tabliste und über dem Namen
		'CapeTextureMixin', 'CapeLayerMixin', 'HatLayerMixin', 'TabBadgeMixin', 'NameTagBadgeMixin',
		// Emotes: Pose auf HumanoidModel#setupAnim; ab 1.21.2 Spieler über den Render-State zuordnen.
		'EmoteModelMixin',
		// Farben: Farb-Durchgang direkt nach GameRenderer#renderLevel (vor HUD und Menüs).
		'ColorGradeMixin']
if (stonecutter.eval(mc, '>=1.21.2')) mixinClasses << 'EmoteStateMixin'
// Menü-Stil (Pause, Serverliste, Laden, Optionen, Welten): Hintergrund, Knöpfe, Karten, Ladebildschirme.
mixinClasses += ['MenuScreenMixin', 'MenuButtonMixin', 'ServerEntryMixin', 'WorldEntryMixin', 'LoadingOverlayMixin',
		'JoinMultiplayerAccessor']
if (stonecutter.eval(mc, '>=1.20.5')) mixinClasses << 'MenuListMixin'
if (stonecutter.eval(mc, '<1.20.3')) mixinClasses << 'SelectionListAccessor'
if (stonecutter.eval(mc, '>=26.1')) mixinClasses << 'PauseBackgroundMixin'
// Leistung: Dynamische FPS/FPS-Messung, Partikel, Entity-Culling, Welt-Details (alle require = 0).
mixinClasses += ['FramePaceMixin', 'ParticleLimitMixin', 'EntityCullMixin', 'BlockEntityCullMixin', 'NameTagCullMixin',
		'LivingNameTagCullMixin', 'TextureAnimationMixin', 'SkyMixin', 'StarsMixin', 'WeatherMixin']
// Nebel-Werte liegen ab 1.21.6 in einem GPU-Puffer – dort kein Nebel-Mixin.
if (stonecutter.eval(mc, '<1.21.6')) mixinClasses << 'FogMixin'
// RenderSystem#lineWidth gibt es ab 1.21.11 nicht mehr (Linienstärke dort unveränderbar).
if (stonecutter.eval(mc, '<1.21.11')) mixinClasses << 'LineWidthMixin'
// Hitbox-Farbe: bis 1.21.8 zeichnet der EntityRenderDispatcher die Boxen selbst.
if (stonecutter.eval(mc, '<1.21.9')) mixinClasses << 'HitboxColorMixin'
// Schild-Position: Haken am Hand-Renderer; Deckkraft ab 1.21.9 im Submit-Sammler; ab 26.3 Modell aus FirstPersonHandsAndItems.
mixinClasses << 'ShieldHandMixin'
if (stonecutter.eval(mc, '>=1.21.9')) mixinClasses << 'ShieldSubmitMixin'
if (stonecutter.eval(mc, '>=26.3')) mixinClasses << 'ShieldModelMixin'

processResources {
	def props = [
			mixins      : mixinClasses.collect { "\"${it}\"" }.join(",\n\t\t"),
			version     : project.version.toString(),
			minecraft   : mc.toString(),
			forgeMajor  : forgeMajor,
			packFields  : project.pack_fields.toString(),
			// Forges Mixin meldet ohnehin nur eine Warnung, wenn die Stufe über seinem Maximum liegt.
			mixinJava   : 'JAVA_17',
			refmapLine  : srg ? '"refmap": "trsclient.refmap.json",' : '',
	]
	inputs.properties(props)
	filesMatching(['META-INF/mods.toml', 'pack.mcmeta', 'trsclient.mixins.json']) {
		expand props
	}
}

tasks.named('jar', Jar) {
	// Forge findet Mixin-Configs in Produktion nur über dieses Manifest-Attribut.
	manifest.attributes('MixinConfigs': 'trsclient.mixins.json')
	from(rootProject.file('../LICENSE')) {
		rename { "${it}_trsclient" }
	}
}

// Die fertige Mod-JAR dieser Version (reobfuskiert für SRG-Versionen) – Task + Datei für collectLauncherJars.
ext.trsModTask = srg ? tasks.named('renameJar') : tasks.named('jar')
ext.trsModFile = srg ? tasks.named('renameJar').flatMap { it.output } : tasks.named('jar', Jar).flatMap { it.archiveFile }
if (srg) {
	tasks.named('assemble') { dependsOn 'renameJar' }
}

// Autotests ohne Ton (siehe gradle/autotest-mute.gradle).
apply from: new File(buildscript.sourceFile.parentFile, '../gradle/autotest-mute.gradle')
