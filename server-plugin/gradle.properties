# 4G: the server mods (Loom / ModDevGradle / ForgeGradle) run as nested builds in the same daemon.
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true

# Plugin
plugin_version=1.0.0
maven_group=dev.theredstonee.trsrules

# Libraries (shaded + relocated into every platform jar)
snakeyaml_version=2.5

# Platform APIs (compileOnly – the server provides them at runtime)
# Lowest supported Bukkit API: everything used exists since 1.8.8; newer servers are covered by the same calls.
spigot_api_version=1.8.8-R0.1-SNAPSHOT
# Only for the Folia scheduler bridge (separate source set, loaded only on Folia).
paper_api_version=1.21.11-R0.1-SNAPSHOT
bungee_api_version=1.21-R0.3
# Velocity 3.x (Java 17 bytecode); also runs on newer Velocity releases (same API surface).
velocity_api_version=3.4.0
# Sponge: compiled against API 8 (Java 17), additionally compile-checked against newer APIs (see sponge/build.gradle).
sponge_api_version=8.2.0
sponge_api_check_versions=12.0.0,17.0.0

junit_version=5.12.2
