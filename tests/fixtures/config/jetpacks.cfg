# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# General settings
##########################################################################################################

general {
    # Enable the jetpack HUD [default: true]
    B:enableHud=true

    # How many ticks between updates [range: 1 ~ 200, default: 20]
    I:updateInterval=20

    # Render distance multiplier [range: 0.5 ~ 4.0, default: 1.0]
    D:renderMultiplier=1.0

    # Display mode
    # Valid values:
    # SIMPLE
    # DETAILED
    # OFF
    S:displayMode=SIMPLE

    # Free text with a # inside
    S:greeting=Hello # World

    # Blocks that cannot be mined
    S:blacklist <
        minecraft:bedrock
        minecraft:barrier
     >

    I:levels <
        1
        2
     >

    client {
        # Show particles [default: true]
        B:"Show Particles"=true
    }

}


