
#Client only settings, mostly things related to rendering
[client]
	#Enable Forge to queue all chunk updates to the Chunk Update thread.
	#May increase FPS significantly, but may also cause weird rendering lag.
	alwaysSetupTerrainOffThread = false
	#When enabled, Forge will show any warnings that occurred during loading.
	showLoadWarnings = true
	#[DEPRECATED] Does nothing anymore, IPv6 is disabled by default
	compressLanIPv6Addresses = true

#General settings
[general]
	#The maximum number of entities
	#Range: 0 ~ 1000
	maxEntities = 200
	#Render scale
	#Range: 0.1 ~ 4.0
	renderScale = 1.0
	#Notification mode
	#Allowed Values: TOAST, CHAT, BOTH, NONE
	notificationMode = "TOAST"
	#Blocked dimensions
	dimensionBlacklist = ["minecraft:the_end", "minecraft:the_nether"]
	multiLine = [
		"a",
		"b"
	]
	literal = 'C:\path'
	inline = { x = 1, y = "z" } # inline table
	when = 1979-05-27T07:32:00Z
	big = 1_000_000

	[general.nested]
		#Range: > 0
		threads = 4

[[servers]]
	name = "Alpha"
	port = 25565

[[servers]]
	name = "Beta"
	port = 25566
