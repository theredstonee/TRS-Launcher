name: Release

# Baut bei jedem Versions-Tag (v1.2.3) den signierten Windows-Installer,
# legt ein (Vorab-)Release an und aktualisiert den Update-Kanal, den der
# eingebaute Auto-Updater abfragt.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Vorhandenes Tag, z. B. v0.1.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      # Ohne Changelog-Eintrag (Englisch + Deutsch) für diese Version kein Release –
      # vor dem langen Build prüfen. Der Text landet im Release und im Auto-Update.
      - name: Release notes from CHANGELOG.md
        shell: bash
        run: node --experimental-strip-types scripts/changelog.mjs notes "${TAG#v}" > release-notes.md

      # Nur bauen und signieren – veröffentlicht wird unten selbst.
      - name: Build signed installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          src=$(ls src-tauri/target/release/bundle/nsis/*_x64-setup.exe | head -1)
          mkdir -p out
          exe="TRS-Launcher_${version}_x64-setup.exe"
          cp "$src" "out/$exe"
          cp "$src.sig" "out/$exe.sig"
          node -e '
            const fs = require("fs");
            const [version, exe, repo, tag] = process.argv.slice(1);
            const signature = fs.readFileSync(`out/${exe}.sig`, "utf8").trim();
            const manifest = {
              version,
              notes: fs.readFileSync("release-notes.md", "utf8").trim(),
              pub_date: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
              platforms: { "windows-x86_64": { signature, url: `https://github.com/${repo}/releases/download/${tag}/${exe}` } },
            };
            fs.writeFileSync("out/latest.json", JSON.stringify(manifest, null, 2));
          ' "$version" "$exe" "$GITHUB_REPOSITORY" "$TAG"
          ls -la out

      - name: Publish release and update channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" out/* --prerelease --title "TRS Launcher $TAG" --notes-file release-notes.md
          fi
          # Der Updater fragt einen festen Kanal ab (Release "updater"), damit
          # auch Vorabversionen gefunden werden.
          gh release view updater >/dev/null 2>&1 || gh release create updater --prerelease --title "Update-Kanal" \
            --notes "Wird automatisch gepflegt – enthält nur latest.json für den Auto-Updater."
          gh release upload updater out/latest.json --clobber
