name: CI

# Tests und Lints laufen getrennt vom Release-Build – so muss der Release
# nicht zweimal kompilieren (Debug für Tests + Release für den Installer).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: check
          cache-on-failure: true

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # generate_context! braucht ein gebautes Frontend.
      - name: Frontend build
        run: pnpm generate

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --workspace
