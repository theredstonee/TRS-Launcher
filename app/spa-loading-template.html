<!-- Ladebildschirm, bis die Oberfläche bereit ist (auch nach einem Update-Neustart).
     Sprachneutral: Hier ist noch keine Übersetzung geladen, also nur Logo und Markenname.
     Halloween: der Merker `trs-event` steht, wenn das Event beim letzten Lauf aktiv war. -->
<script>
  try {
    if (localStorage.getItem('trs-event') === 'halloween') document.documentElement.dataset.event = 'halloween'
  } catch (e) {}
</script>
<div class="trs-splash" role="status" aria-busy="true" aria-label="TRS Launcher">
  <img src="/icon.png" alt="" width="64" height="64" />
  <div class="trs-splash-name">TRS Launcher</div>
  <div class="trs-splash-wire"><span></span></div>
  <canvas class="trs-splash-witch" width="320" height="56" hidden></canvas>
</div>
<style>
  html, body { margin: 0; height: 100%; background: #111114; }
  .trs-splash {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: radial-gradient(ellipse at center, #1c1a1d 0%, #111114 70%);
    font-family: system-ui, sans-serif; color: #e8e6e3;
  }
  .trs-splash img { image-rendering: pixelated; filter: drop-shadow(0 0 14px rgba(224, 40, 30, 0.55)); }
  .trs-splash-name { font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .trs-splash-wire { position: relative; width: 160px; height: 3px; background: #3a1512; overflow: hidden; }
  .trs-splash-wire span {
    position: absolute; inset: 0; width: 40%;
    background: linear-gradient(90deg, transparent, #e0281e, #ff6a4d, #e0281e, transparent);
    box-shadow: 0 0 10px #e0281e;
    animation: trs-signal 1.1s steps(16) infinite;
  }
  .trs-splash-witch { display: none; image-rendering: pixelated; }
  html[data-event="halloween"], html[data-event="halloween"] body { background: #120a1c; }
  html[data-event="halloween"] .trs-splash {
    background: radial-gradient(ellipse at center, #1d1428 0%, #120a1c 70%);
    color: #efe6ff;
  }
  html[data-event="halloween"] .trs-splash img { filter: drop-shadow(0 0 14px rgba(255, 122, 26, 0.55)); }
  html[data-event="halloween"] .trs-splash-wire { display: none; }
  html[data-event="halloween"] .trs-splash-witch { display: block; }
  @keyframes trs-signal { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .trs-splash-wire span { animation: none; width: 100%; } }
</style>
<script>
  (function () {
    if (document.documentElement.dataset.event !== 'halloween') return
    var canvas = document.querySelector('.trs-splash-witch')
    if (!canvas || !canvas.getContext) return
    var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
    var img = new Image()
    img.src = '/halloween/witch-final.png'
    var sparks = []
    function paint(now) {
      var ctx = canvas.getContext('2d')
      var W = canvas.width
      var H = canvas.height
      ctx.imageSmoothingEnabled = false
      ctx.clearRect(0, 0, W, H)
      var period = 2800
      var u = reduced ? 0.5 : (now % (period * 2)) / period
      var p = u <= 1 ? u : 2 - u
      var x0 = 28
      var w = W - 64
      var y = H - 16
      ctx.fillStyle = '#3a3a44'
      ctx.fillRect(x0 - 4, y - 4, w + 8, 14)
      ctx.fillStyle = '#24242b'
      ctx.fillRect(x0 - 2, y - 2, w + 4, 10)
      for (var x = 0; x < w; x += 4) {
        var on = x < w * p
        ctx.fillStyle = on ? '#ff2a1a' : '#4a0d0a'
        ctx.fillRect(x0 + x, y + 2, 3, 3)
      }
      ctx.fillStyle = '#ff3b1f'
      ctx.fillRect(x0 - 16, y - 4, 4, 3)
      ctx.fillStyle = '#6b4a2a'
      ctx.fillRect(x0 - 15, y - 1, 2, 8)
      var lit = p > 0.97
      ctx.fillStyle = lit ? '#ffd27a' : '#5a3a22'
      ctx.fillRect(x0 + w + 6, y - 6, 12, 12)
      ctx.fillStyle = lit ? '#fff2c0' : '#3a2416'
      ctx.fillRect(x0 + w + 8, y - 4, 8, 8)
      var frame = reduced ? 0 : Math.floor(now / 110) % 6
      var bob = reduced ? 0 : Math.round(Math.sin(now / 300) * 2) * 2
      var wx = x0 + w * p - 28
      var wy = y - 40 + bob
      if (!reduced && Math.random() < 0.5) sparks.push({ x: wx + 8, y: wy + 34, vx: -0.4, vy: 0.3, life: 1 })
      for (var i = sparks.length - 1; i >= 0; i--) {
        var q = sparks[i]
        q.x += q.vx
        q.y += q.vy
        q.life -= 0.04
        if (q.life <= 0) sparks.splice(i, 1)
        else {
          ctx.fillStyle = 'rgba(230,30,20,' + Math.max(0, q.life) + ')'
          ctx.fillRect((q.x / 2 | 0) * 2, (q.y / 2 | 0) * 2, 2, 2)
        }
      }
      if (img.complete && img.naturalWidth) ctx.drawImage(img, frame * 48, 0, 48, 48, wx, wy, 40, 40)
      if (!reduced) requestAnimationFrame(paint)
    }
    img.onload = function () { requestAnimationFrame(paint) }
    requestAnimationFrame(paint)
  })()
</script>
