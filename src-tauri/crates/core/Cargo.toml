[package]
name = "trs-core"
description = "UI-unabhängiger Kern des TRS Launchers"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures = "0.3.34"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "json", "stream", "gzip", "system-proxy", "form", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "sync", "macros", "rt-multi-thread", "process", "io-util", "net", "time"] }
tracing = { version = "0.1.44", features = ["log"] }
uuid = { version = "1.26.1", features = ["v4"] }
windows = { version = "0.62.2", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_NetworkManagement_Dns"] }
zip = "8.6.0"

[dev-dependencies]
tempfile = "3.27.0"
