[package]
name = "trs-core"
description = "UI-unabhängiger Kern des TRS Launchers"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
futures = "0.3.34"
hmac = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
minisign-verify = "0.2.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.20"
toml = "1.1.6"
tokio = { version = "1.53.1", features = ["fs", "sync", "macros", "rt-multi-thread", "process", "io-util", "net", "time"] }
tracing = { version = "0.1.44", features = ["log"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
zip = "8.6.0"

# Windows: DPAPI, Registry, Firewall, Papierkorb, DNS, GPU (DXGI) und Clips (WASAPI).
[target.'cfg(windows)'.dependencies]
wasapi = "0.24.0"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_NetworkManagement_Dns", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_WindowsFirewall", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# Desktop: TLS über das System (SChannel/OpenSSL) wie bisher.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "json", "stream", "gzip", "system-proxy", "form", "query", "multipart"] }

# Android/iOS: rustls mit ring (kein OpenSSL im NDK nötig, baut ohne CMake/NASM).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "json", "stream", "gzip", "system-proxy", "form", "query", "multipart"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }

# Linux: Prozessgruppen/Signale, Token-Schlüssel im Schlüsselbund (Secret Service
# über zbus, reines Rust ohne libdbus) und ChaCha20-Poly1305 für die Tokens.
[target.'cfg(unix)'.dependencies]
chacha20poly1305 = "0.10.1"
getrandom = "0.3.4"
keyring-core = "1.0.0"
libc = "0.2.189"

[target.'cfg(all(unix, not(any(target_os = "android", target_os = "ios"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

# Android: Token-Schlüssel in SharedPreferences, verschlüsselt mit einem Schlüssel aus dem
# Android Keystore; TLS-Wurzeln von Mozilla (der System-Verifier bräuchte eine Java-Komponente).
[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0.0"
webpki-root-certs = "1"

# iOS: Token-Schlüssel in der Data-Protection-Keychain; TLS prüft der System-Vertrauensspeicher.
[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["protected"] }

[dev-dependencies]
minisign = "0.9.1"
tempfile = "3.27.0"
