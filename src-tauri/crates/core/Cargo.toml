[package]
name = "trs-core"
description = "UI-unabhängiger Kern des TRS Launchers"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2", "json", "stream", "gzip", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "sync", "macros", "rt-multi-thread"] }
tracing = { version = "0.1.44", features = ["log"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
