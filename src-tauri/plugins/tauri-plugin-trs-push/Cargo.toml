[package]
name = "tauri-plugin-trs-push"
description = "TRS Launcher – Push-Benachrichtigungen auf Android (UnifiedPush) und iOS (Abholen im Hintergrund)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license = "GPL-3.0-only"
links = "tauri-plugin-trs-push"
build = "build.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5" }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
