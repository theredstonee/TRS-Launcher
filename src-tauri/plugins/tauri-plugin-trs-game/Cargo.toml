[package]
name = "tauri-plugin-trs-game"
description = "TRS Launcher – Minecraft: Java Edition auf Android/iOS (eingebettete JVM, Renderer, Touch-Eingabe)"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true
license = "GPL-3.0-only"
links = "tauri-plugin-trs-game"
build = "build.rs"

[dependencies]
log = "0.4.34"
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "xz"] }
# TLS-Backend kommt per Feature-Vereinigung aus dem Kern (rustls auf Mobilgeräten).
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tauri = { version = "2.11.5" }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["fs", "io-util", "sync"] }
# iOS-Runtimes (Amethyst) sind ZIP-Dateien mit einer .tar.xz darin.
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
lzma-rust2 = { version = "0.16.5", default-features = false, features = ["std", "xz", "encoder"] }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["fs", "io-util", "sync", "macros", "rt-multi-thread"] }

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
