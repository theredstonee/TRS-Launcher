[workspace]
members = [".", "crates/core", "plugins/tauri-plugin-trs-game"]
resolver = "3"

[workspace.package]
version = "0.17.1"
edition = "2024"
authors = ["theredstonee"]
publish = false

[package]
name = "trs-launcher"
description = "TRS Launcher – Minecraft-Launcher"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "trs_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
# Thin-LTO + parallele Codegen-Units: deutlich schnellere Release-Builds bei
# kaum größerer Datei (ein paar Hundert KB).
codegen-units = 16
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
qrcode = { version = "0.14.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-deep-link = "~2.4.10"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-log = "2.9.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
thiserror = "2.0.20"
trs-core = { path = "crates/core" }

# Nur Desktop: Zwischenablage, Single-Instance, eingebauter Updater (+ Neustart) und Fensterzustand.
# Android/iOS: eine Instanz und Fenster verwaltet das System, Updates laufen über den Kanal `mobile`.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = { version = "3.6.1", default-features = false, features = ["image-data"] }
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = { version = "2.4.4", features = ["deep-link"] }
tauri-plugin-updater = "2.12.0"
tauri-plugin-window-state = "2.4.1"

# Nur Android/iOS: Spiel-Engine (eingebettete JVM) und QR-Scanner der PC-Fernbedienung.
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-trs-game = { path = "plugins/tauri-plugin-trs-game" }
tauri-plugin-barcode-scanner = "2.4.6"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
