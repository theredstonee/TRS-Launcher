[workspace]
members = [".", "crates/core"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["theredstonee"]
publish = false

[package]
name = "trs-launcher"
description = "TRS Launcher – Minecraft-Launcher"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "trs_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-log = "2.9.1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-process = "2.3.1"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.12.0"
tauri-plugin-window-state = "2.4.1"
thiserror = "2.0.20"
trs-core = { version = "0.1.0", path = "crates/core" }

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
